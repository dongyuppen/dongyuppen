name: Metrics

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN(PAT)이 있으면 비공개 저장소까지 집계, 없으면 공개 데이터만
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: dongyuppen
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: update metrics"

      - name: Language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: dongyuppen
          filename: metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: HTML, CSS, SCSS, Dockerfile
          config_timezone: Asia/Seoul
          committer_message: "chore: update language metrics"
